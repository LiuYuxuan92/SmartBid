###############################################################################
# 招投标智能辅助系统 - 完整配置模板
# 复制此文件为 config.yaml 并填入实际值
###############################################################################

crawler:
  target_platforms:
    - url: "https://example.com"
      name: "example_platform"
      parser: "BaseParser"
  proxies: []
  user_agents: ["Mozilla/5.0"]
  crawl_delay: [1, 3]       # 请求间隔随机范围（秒）
  retry_limit: 3
  connection_timeout: 120    # 连接超时（秒）
  request_timeout: 30        # 请求超时（秒）

dxf_parser:
  unit_scale: 1.0
  quota_db_path: "data/quota_db.json"

rag:
  llm_api_key: "YOUR_API_KEY_HERE"
  llm_api_url: "https://api.openai.com/v1"
  llm_model: "gpt-4"
  embedding_model: "text-embedding-ada-002"
  chunk_size: 800
  chunk_overlap: 50
  similarity_threshold: 0.6
  max_retries: 3
  request_timeout: 60

monte_carlo:
  iterations: 10000
  win_probability_threshold: 0.6
  execution_timeout: 120     # 模拟超时（秒）

pipeline:
  output_base: "D:/CADAI/output"
  module_timeout: 300        # 模块执行超时（秒）
